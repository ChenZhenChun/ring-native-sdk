plugins {
    id 'base'
    id 'maven-publish'
}

group = 'com.gitee.osaiyoyou'
version = System.getenv('VERSION') ?: '1.0.0'

publishing {
    publications {
        sdk(MavenPublication) {
            artifactId = rootProject.name
            artifact(file('android/blesdk.aar')) {
                extension = 'aar'
            }
            pom {
                name = 'Ring Android SDK'
                description = 'Prebuilt smart ring Android SDK binary dependency.'
                packaging = 'aar'
                withXml {
                    def dependenciesNode = asNode().appendNode('dependencies')
                    [
                        ['org.greenrobot', 'eventbus', '3.2.0'],
                        ['androidx.core', 'core-ktx', '1.1.0'],
                        ['androidx.appcompat', 'appcompat', '1.1.0'],
                        ['androidx.legacy', 'legacy-support-v4', '1.0.0'],
                        ['com.google.android.material', 'material', '1.0.0'],
                        ['androidx.constraintlayout', 'constraintlayout', '1.1.3'],
                        ['com.github.getActivity', 'XXPermissions', '13.2'],
                        ['com.github.zzy0516alex', 'FileSelectorRelease', 'v6.1']
                    ].each { external ->
                        def dependencyNode = dependenciesNode.appendNode('dependency')
                        dependencyNode.appendNode('groupId', external[0])
                        dependencyNode.appendNode('artifactId', external[1])
                        dependencyNode.appendNode('version', external[2])
                    }
                }
            }
        }
    }
}

